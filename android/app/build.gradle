plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Signing configuration. Release builds prefer, in order:
//   1. KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
//      environment variables (GitHub Actions secrets), or
//   2. a local keystore.properties file (./keystore.properties), or
//   3. the debug signing config so `flutter build apk --release` still
//      works on a developer machine without a keystore.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasEnvKeystore = System.getenv("KEYSTORE_BASE64") != null &&
        !System.getenv("KEYSTORE_BASE64").isEmpty()
def hasPropertiesKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties["storeFile"] != null &&
        file(keystoreProperties["storeFile"]).exists()

android {
    namespace = "com.mapbanai.mapbanai"
    compileSdk = 36
    ndkVersion = "28.1.13356709"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.mapbanai.mapbanai"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasEnvKeystore) {
                def decodedFile = file("${rootProject.projectDir}/ci-keystore.jks")
                new FileOutputStream(decodedFile).withCloseable { fos ->
                    fos.write(java.util.Base64.decoder.decode(System.getenv("KEYSTORE_BASE64")))
                }
                storeFile decodedFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else if (hasPropertiesKeystore) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasEnvKeystore || hasPropertiesKeystore) {
                signingConfig = signingConfigs.release
            } else {
                // Signing with the debug keys so `flutter run --release` and
                // local `flutter build apk --release` keep working when no
                // release keystore is configured.
                signingConfig = signingConfigs.debug
            }
        }
    }
}

subprojects {
    subproject ->
        if (subproject.name.contains('maplibre_gl')) {
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '1.8'
                }
            }
        }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.core:core:1.12.0'
    }
}

dependencies {
    // Used by MainActivity to share the downloaded APK with the system
    // package installer via the ${applicationId}.fileprovider provider
    // declared in AndroidManifest.xml.
    implementation 'androidx.core:core:1.12.0'
}

flutter {
    source = "../.."
}
