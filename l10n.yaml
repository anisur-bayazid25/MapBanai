arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
preferred-supported-locales: ["en", "bn"]
# Use synthetic-package: false to generate into lib/l10n so imports are package:mapbanai/l10n/...
synthetic-package: false
nullable-getter: false
format: true
use-escaping: true
