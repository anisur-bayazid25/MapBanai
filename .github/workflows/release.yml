name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Decode keystore and create key.properties
        run: |
          # Support both new (MAPBANAI_ prefix) and legacy secret names for base64
          if [ -n "${{ secrets.MAPBANAI_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.MAPBANAI_KEYSTORE_BASE64 }}" | base64 --decode > android/mapbanai-release.jks
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/mapbanai-release.jks
          else
            echo "ERROR: No keystore secret found (set MAPBANAI_KEYSTORE_BASE64 or KEYSTORE_BASE64)" >&2
            exit 1
          fi
          if [ ! -s android/mapbanai-release.jks ]; then
            echo "ERROR: Decoded keystore is empty — check base64 secret" >&2
            ls -lh android/mapbanai-release.jks || true
            exit 1
          fi
          echo "Keystore decoded: $(wc -c < android/mapbanai-release.jks) bytes"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=mapbanai-release.jks" >> android/key.properties
          cat android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
