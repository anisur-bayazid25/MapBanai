name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Decode keystore and create key.properties
        run: |
          # Try new secret name first, then legacy; if neither is set, build with debug signing
          # (release will still land, but in-place updates will require uninstall until secrets are set).
          if [ -n "${{ secrets.MAPBANAI_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.MAPBANAI_KEYSTORE_BASE64 }}" | base64 --decode > android/mapbanai-release.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=mapbanai-release.jks" >> android/key.properties
            echo "Keystore decoded: $(wc -c < android/mapbanai-release.jks) bytes (MAPBANAI prefix)"
            cat android/key.properties
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/mapbanai-release.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=mapbanai-release.jks" >> android/key.properties
            echo "Keystore decoded: $(wc -c < android/mapbanai-release.jks) bytes (legacy name)"
            cat android/key.properties
          else
            echo "WARNING: No keystore secret found (set MAPBANAI_KEYSTORE_BASE64 + KEYSTORE_PASSWORD/KEY_PASSWORD/KEY_ALIAS) — building with debug signing; in-place updates will require uninstall until secrets are set." >&2
            rm -f android/key.properties android/mapbanai-release.jks
          fi
          if [ -f android/key.properties ]; then
            echo "Using release signing: $(cat android/key.properties | tr '\n' ' ')"
          else
            echo "Using debug signing (no key.properties)"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
