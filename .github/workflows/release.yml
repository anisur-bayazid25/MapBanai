name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Decode keystore and create key.properties
        run: |
          # Release builds must retain the production signing identity.
          if [ -n "${{ secrets.MAPBANAI_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.MAPBANAI_KEYSTORE_BASE64 }}" | base64 --decode > android/mapbanai-release.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=mapbanai-release.jks" >> android/key.properties
            echo "Keystore decoded: $(wc -c < android/mapbanai-release.jks) bytes (MAPBANAI prefix)"
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/mapbanai-release.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=mapbanai-release.jks" >> android/key.properties
            echo "Keystore decoded: $(wc -c < android/mapbanai-release.jks) bytes (legacy name)"
          else
            echo "Release signing secrets are missing." >&2
            exit 1
          fi
          echo "Release signing configured."

      - name: Install dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Run tests
        run: flutter test --concurrency=1

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: build/app/outputs/flutter-apk/app-release.apk
